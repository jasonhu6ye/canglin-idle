name: Deploy game server

# 服务器结算程序（Supabase Edge Function「game」，11-02）：结算代码变了就重新打包部署。
# 需要仓库 Secrets 里的 SUPABASE_ACCESS_TOKEN（Supabase 账号令牌，Edge Functions 读写权限）。
on:
  push:
    branches: [main]
    paths:
      - 'src/core/**'
      - 'src/server/**'
      - 'src/i18n/**'
      - 'supabase/functions/**'
      - '.github/workflows/game-server.yml'
  workflow_dispatch:

concurrency:
  group: game-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run src/server src/core
      - run: npx esbuild src/server/edge.ts --bundle --format=esm --platform=neutral --target=es2022 --main-fields=module,main --outfile=supabase/functions/game/bundle.js
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy game --project-ref yrmqaanyonmouzlziqqd --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
