<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b140f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="苍岭放置" />
    <title>苍岭放置</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23c89a4a%22/%3E%3Cpath d=%22M3 12 8 3l5 9z%22 fill=%22%233a2a1a%22/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"><div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#1b140f;color:#e8b84a;font:16px/1.5 system-ui,sans-serif">
      <b style="font-size:24px;letter-spacing:4px">苍岭放置</b>
      <span style="color:#a89070;font-size:13px">正在生成世界地图，第一次打开要几秒钟…</span>
      <i style="width:140px;height:4px;background:#3a2a1a;overflow:hidden;display:block"><i style="display:block;width:40%;height:100%;background:#e8b84a;animation:ld 1.2s ease-in-out infinite alternate"></i></i>
      <style>@keyframes ld{from{margin-left:0}to{margin-left:60%}}</style>
    </div></div>
    <script>
      // 英文语言包：加载画面也换成英文（语言选择存在 canglin-lang）
      try {
        if (localStorage.getItem("canglin-lang") === "en") {
          document.documentElement.lang = "en";
          document.title = "Sword and Spells";
          var ld = document.querySelector("#root b"), tip = document.querySelector("#root span");
          if (ld) { ld.textContent = "Sword and Spells"; ld.style.letterSpacing = "2px"; }
          if (tip) tip.textContent = "Generating the world map. The first load takes a few seconds…";
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // iOS Safari 忽略 user-scalable=no，这里拦掉双指缩放整页
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
    </script>
  </body>
</html>
